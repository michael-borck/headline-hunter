name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Assemble the site: landing page at the root, the apps under /app.
      # (In the repo, index.html is the worksheet app — served at / by app.py —
      # but on Pages the landing page takes the root instead.)
      - name: Assemble site
        run: |
          mkdir -p _site/app
          cp landing/index.html _site/index.html
          cp index.html studio.html _site/app/
          cp -r lib _site/app/lib

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
